# Builds and tests every push / pull request; a "v*" tag publishes a signed APK
# as a GitHub release (the app's update check reads those releases).
name: Android

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # App unit tests, plus the JVM modules (API contracts, ad block, offline index, GraphQL
      # errors). The live tests in host-cdp skip themselves without a browser to drive.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :api:test :api-spotify:test :host-cdp:test

      - name: Debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: spotifusion-fork-debug-apk
          path: base/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # Fork: proves the shared-storage export on a real Android system image. A fixture of each
  # format is exported through SharedAudioExporter; the test then checks that it is in
  # Download/Spotifusion/, listed by MediaStore, tagged, and played by the platform MediaPlayer
  # alone. Afterwards the files are pulled with adb and opened with ffprobe/ffmpeg.
  shared-storage-test:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Export test on an emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: base
          script: |
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.music.spotui.data.offline.SharedAudioExporterTest
            adb shell ls -l /sdcard/Download/Spotifusion/ | tee ../shared-folder-listing.txt
            mkdir -p ../exported-evidence
            adb pull /sdcard/Download/Spotifusion/. ../exported-evidence/

      - name: Open the exported files with ffprobe / ffmpeg (independent of Android)
        working-directory: .
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ls -l exported-evidence
          test "$(ls exported-evidence | wc -l)" -ge 4
          for f in exported-evidence/*; do
            echo "== $f"
            ffprobe -v error -show_entries format=format_name:format_tags=title,artist,album -of default=nw=1 "$f"
            ffmpeg -v error -i "$f" -f null -
          done | tee ffprobe-report.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shared-folder-evidence
          path: |
            shared-folder-listing.txt
            ffprobe-report.txt
            exported-evidence/
            base/app/build/reports/androidTests/
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the previous tag, for a beta's notes

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # Two keys, one per channel (they install side by side as two apps):
      # betas ("v2.0.0-beta.3") use MYSPOTI_KEYSTORE_BASE64, MYSPOTI_KEYSTORE_PASSWORD,
      # MYSPOTI_KEY_ALIAS, MYSPOTI_KEY_PASSWORD; releases use the same names with
      # MYSPOTI_STABLE_ in front. Keep each key for good, or installed apps cannot update.
      - name: Signing key
        id: signing
        env:
          BETA: ${{ contains(github.ref_name, '-') }}
          BETA_KEYSTORE: ${{ secrets.MYSPOTI_KEYSTORE_BASE64 }}
          STABLE_KEYSTORE: ${{ secrets.MYSPOTI_STABLE_KEYSTORE_BASE64 }}
        run: |
          if [ "$BETA" = "true" ]; then KEYSTORE_BASE64="$BETA_KEYSTORE"; NAME=MYSPOTI_KEYSTORE_BASE64; else KEYSTORE_BASE64="$STABLE_KEYSTORE"; NAME=MYSPOTI_STABLE_KEYSTORE_BASE64; fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No $NAME secret configured; skipping CI release APK upload."
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Release APK
        if: steps.signing.outputs.has_keystore == 'true'
        env:
          MYSPOTI_KEYSTORE: ${{ runner.temp }}/release.jks
          MYSPOTI_KEYSTORE_PASSWORD: ${{ contains(github.ref_name, '-') && secrets.MYSPOTI_KEYSTORE_PASSWORD || secrets.MYSPOTI_STABLE_KEYSTORE_PASSWORD }}
          MYSPOTI_KEY_ALIAS: ${{ contains(github.ref_name, '-') && secrets.MYSPOTI_KEY_ALIAS || secrets.MYSPOTI_STABLE_KEY_ALIAS }}
          MYSPOTI_KEY_PASSWORD: ${{ contains(github.ref_name, '-') && secrets.MYSPOTI_KEY_PASSWORD || secrets.MYSPOTI_STABLE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$((1000 + GITHUB_RUN_NUMBER))" \
            -PupdateRepo="$GITHUB_REPOSITORY"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/myspoti-$VERSION.apk"

      # This version's section of CHANGELOG.md becomes the release description.
      - name: Release notes
        if: steps.signing.outputs.has_keystore == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 == "## " v {f=1; next} /^## / && f {exit} f' ../CHANGELOG.md > release-notes.md
          # A beta without its own section: the CHANGELOG lines added since the previous tag,
          # else (first beta) the section of the version it leads to.
          PREVIOUS="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ ! -s release-notes.md ] && [ "$VERSION" != "${VERSION%%-*}" ] && [ -n "$PREVIOUS" ]; then
            git diff "$PREVIOUS" "$GITHUB_REF_NAME" -- ../CHANGELOG.md | grep '^+- ' | sed 's/^+//' > release-notes.md || true
          fi
          [ -s release-notes.md ] || awk -v v="${VERSION%%-*}" '$0 == "## " v {f=1; next} /^## / && f {exit} f' ../CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See the commits since the previous release." > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        if: steps.signing.outputs.has_keystore == 'true'
        with:
          files: base/app/build/outputs/apk/release/myspoti-*.apk
          body_path: base/release-notes.md
          generate_release_notes: true
          # "v2.0.0-beta.1": a pre-release, offered only to beta builds.
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Announces the release on Discord (secret DISCORD_WEBHOOK_URL; nothing posted without it).
      # A release created with GITHUB_TOKEN triggers no other workflow, hence this step here.
      - name: Discord announcement
        if: steps.signing.outputs.has_keystore == 'true'
        continue-on-error: true
        working-directory: .
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/discord_release.py "$GITHUB_REF_NAME"
